<!-- Dial logo v1 - rotary knob with tick marks. Replaced by the vinyl+tonearm
     mark (see static/index.html) because it didn't read as "music" at a
     glance. Kept here for reference / rollback: paste the inner markup back
     into the .brand-mark <svg> in static/index.html to restore it. -->
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="brand-mark">
  <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.45">
    <line x1="12" y1="1" x2="12" y2="2.8"/>
    <line x1="12" y1="1" x2="12" y2="2.8" transform="rotate(45 12 12)"/>
    <line x1="12" y1="1" x2="12" y2="2.8" transform="rotate(90 12 12)"/>
    <line x1="12" y1="1" x2="12" y2="2.8" transform="rotate(135 12 12)"/>
    <line x1="12" y1="1" x2="12" y2="2.8" transform="rotate(180 12 12)"/>
    <line x1="12" y1="1" x2="12" y2="2.8" transform="rotate(225 12 12)"/>
    <line x1="12" y1="1" x2="12" y2="2.8" transform="rotate(270 12 12)"/>
    <line x1="12" y1="1" x2="12" y2="2.8" transform="rotate(315 12 12)"/>
  </g>
  <circle cx="12" cy="12" r="6.7" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.6"/>
  <line x1="12" y1="12" x2="12" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" transform="rotate(35 12 12)"/>
  <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
</svg>
